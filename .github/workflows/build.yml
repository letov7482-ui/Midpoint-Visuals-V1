name: Build Midpoint Visuals

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project archive
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "No .zip file found at repo root, assuming sources are already unpacked."
            exit 0
          fi
          echo "Found archive: $ZIP_FILE"
          mkdir -p _extracted
          unzip -o "$ZIP_FILE" -d _extracted

          ENTRIES=$(ls _extracted)
          COUNT=$(echo "$ENTRIES" | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "_extracted/$ENTRIES" ]; then
            cp -r "_extracted/$ENTRIES/." .
          else
            cp -r _extracted/. .
          fi
          rm -rf _extracted

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.12

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midpoint-visuals-jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
