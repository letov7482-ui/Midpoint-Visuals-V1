name: Build Midpoint Visuals

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'


      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew


      - name: Build Fabric Mod
        run: ./gradlew build


      - name: Upload Mod Jar
        uses: actions/upload-artifact@v4
        with:
          name: Midpoint-Visuals-build
          path: build/libs/*.jar
